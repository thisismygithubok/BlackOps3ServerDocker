services:
  bo3:
    image: thisismynameok/bo3-server-docker:latest
    container_name: bo3
    ports:
      - "27017:27017/udp"     # the game uses UDP only; for the browser's LAN tab use network_mode: host instead
    init: true                # forwards docker stop to wine
    stdin_open: true          # `docker attach bo3` for the server console (detach: Ctrl-P Ctrl-Q)
    tty: true
    restart: unless-stopped
    command: boiii            # boiii (EZZBOIII) | t7x | vanilla (Treyarch's server, MP only). Players must use the same client.
    environment:
      GAME_PORT: 27017
      SERVER_CONFIG: server_zm.cfg   # server_zm.cfg (zombies) | server.cfg (MP) | server_cp.cfg (coop campaign)
      MOD_ID: ""              # Workshop ID of a mod, downloaded by `install` / `update`
      STEAM_USER: ""          # required for install: a Steam account that owns BO3 (anonymous is refused)
      # Maps: `install` / `update` download their files (run `update` after changing them)
      GAME_MODE: zclassic       # zclassic (zombies) | tdm, dom, ... (MP)
      MAPS: "zm_genesis"        # map codenames, played in order
      # WORKSHOP_MAPS: ""       # Workshop IDs of custom maps; put their codenames in MAPS
      # Server settings, override SERVER_CONFIG (apply with `docker compose up -d`)
      SERVER_NAME: "My Zombies Server"
      # Optional, defaults come from SERVER_CONFIG. All env vars are listed in the README (step 3).
      # SERVER_PASSWORD: "secret"
      # RCON_PASSWORD: ""
      # MAX_PLAYERS: "4"
      # SET_<setting>: "value"  # any setting without its own env var
    volumes:
      - ./server:/server      # game files + configs (server/UnrankedServer/zone/server_zm.cfg)
      - ./home:/home/bo3      # Wine prefix + cached Steam login
